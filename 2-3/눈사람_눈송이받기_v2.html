<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>눈사람 눈송이 받기</title>
<style>
  :root {
    --sky-top: #1d2b4f;
    --sky-mid: #3b4f86;
    --sky-low: #8f8fc4;
    --ink: #f4f7ff;
    --chip: rgba(255, 255, 255, 0.12);
    --chip-line: rgba(255, 255, 255, 0.28);
    --accent: #ffb85c;
  }
  * { box-sizing: border-box; }
  html, body { width: 100%; height: 100%; margin: 0; }
  body {
    overflow: hidden;
    background: var(--sky-top);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  }
  #game {
    position: relative;
    width: 100%;
    height: 100%;
    min-height: 320px;
  }
  canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }
  .hud {
    position: absolute;
    z-index: 6;          /* 시작·끝 화면 위에서도 또렷하게 보이게 */
    top: 20px;
    left: 20px;
    right: 20px;
    display: flex;
    justify-content: space-between;
    gap: 12px;
    pointer-events: none;
  }
  .hud span {
    padding: 10px 18px;
    border: 1px solid var(--chip-line);
    border-radius: 14px;
    background: var(--chip);
    backdrop-filter: blur(6px);
    font-size: clamp(16px, 2.2vw, 21px);
    font-weight: 700;
    letter-spacing: -0.01em;
    font-variant-numeric: tabular-nums;
  }
  #time.low { color: var(--accent); border-color: rgba(255, 184, 92, 0.6); }
  #result {
    position: absolute;
    z-index: 5;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: rgba(20, 28, 56, 0.55);
    backdrop-filter: blur(3px);
  }
  #result.show, #intro.show { display: flex; }
  #intro {
    position: absolute;
    z-index: 5;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: rgba(20, 28, 56, 0.55);
    backdrop-filter: blur(3px);
  }
  #introTitle {
    margin: 0 0 24px;
    font-size: clamp(24px, 4vw, 30px);
    font-weight: 800;
    letter-spacing: -0.02em;
  }
  .panel {
    width: min(360px, 100%);
    padding: 34px 28px 30px;
    text-align: center;
    border-radius: 22px;
    border: 1px solid rgba(255, 255, 255, 0.35);
    background: rgba(255, 255, 255, 0.95);
    color: #1d2b4f;
    box-shadow: 0 24px 60px rgba(6, 10, 30, 0.45);
  }
  #resultText {
    margin: 0 0 24px;
    font-size: clamp(24px, 4vw, 30px);
    font-weight: 800;
    letter-spacing: -0.02em;
  }
  #restart, #startBtn {
    border: 0;
    border-radius: 12px;
    padding: 13px 30px;
    background: #1d2b4f;
    color: #fff;
    font: inherit;
    font-size: 17px;
    font-weight: 700;
    cursor: pointer;
  }
  #restart:hover, #startBtn:hover { background: #2c3f72; }
  #restart:focus-visible, #startBtn:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
  @media (max-width: 520px) {
    .hud { top: 12px; left: 12px; right: 12px; }
    .hud span { padding: 8px 12px; }
  }
</style>
</head>
<body>
<main id="game" aria-label="눈사람 눈송이 받기 게임">
  <canvas id="canvas" aria-hidden="true"></canvas>
  <div class="hud">
    <span id="time">남은 시간 45초</span>
    <span id="score">받은 눈송이 0개</span>
  </div>
  <section id="intro" class="show">
    <div class="panel">
      <h1 id="introTitle">눈사람 눈송이 받기</h1>
      <button id="startBtn" type="button">시작</button>
    </div>
  </section>
  <section id="result" aria-live="polite">
    <div class="panel">
      <p id="resultText">끝! 받은 눈송이 0개</p>
      <button id="restart" type="button">다시 하기</button>
    </div>
  </section>
</main>
<script>
(() => {
  // ---- 정해진 값 (기획서: 45초, 약 1초에 하나, 속도는 한 판 내내 같음) ----
  const DURATION = 45000;        // 한 판 길이(ms)
  const SPAWN_INTERVAL = 1000;   // 눈송이 나오는 간격(ms)
  const SNOW_SPEED = 160;        // 눈송이 떨어지는 속도(px/초)
  const PLAYER_SPEED = 360;      // 눈사람 움직이는 속도(px/초)
  const FLAKE_R = 10;            // 눈송이 반지름
  const GROUND_H = 56;           // 바닥 눈 높이

  const game = document.getElementById('game');
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const timeEl = document.getElementById('time');
  const scoreEl = document.getElementById('score');
  const result = document.getElementById('result');
  const resultText = document.getElementById('resultText');
  const restartBtn = document.getElementById('restart');
  const intro = document.getElementById('intro');
  const startBtn = document.getElementById('startBtn');

  // 눈사람 크기 (흰 동그라미 두 개)
  const BODY_R = 36;
  const HEAD_R = 25;
  const HALF_W = BODY_R;         // 화면 밖으로 안 나가게 막을 때 쓰는 절반 너비

  let W = 0, H = 0;
  let playerX = 0;
  let score = 0;
  let running = false;
  let startTime = 0;
  let lastFrame = 0;
  let lastSpawn = 0;
  let flakes = [];
  let pops = [];                 // 받았을 때 잠깐 보이는 "+1"
  const keys = { left: false, right: false };

  // 배경에 고정으로 그릴 작은 별 (떨어지지 않으므로 눈송이와 헷갈리지 않음)
  let stars = [];

  function resize() {
    const dpr = window.devicePixelRatio || 1;
    W = game.clientWidth;
    H = game.clientHeight;
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    stars = Array.from({ length: Math.round(W * H / 14000) }, () => ({
      x: Math.random() * W,
      y: Math.random() * H * 0.55,
      r: Math.random() * 1.2 + 0.3,
      a: Math.random() * 0.5 + 0.25
    }));
    clampPlayer();
    if (!running) draw();
  }

  function clampPlayer() {
    playerX = Math.max(HALF_W, Math.min(W - HALF_W, playerX));
  }

  // 눈사람 두 동그라미의 중심 위치
  function snowmanParts() {
    const baseY = H - GROUND_H + 10;          // 몸통 아래쪽이 바닥에 살짝 묻힘
    const bodyY = baseY - BODY_R;
    const headY = bodyY - BODY_R - HEAD_R + 10;
    return { bodyY, headY };
  }

  function caught(f) {
    const { bodyY, headY } = snowmanParts();
    const hit = (cy, r) => {
      const dx = f.x - playerX, dy = f.y - cy, rr = r + FLAKE_R - 2;
      return dx * dx + dy * dy <= rr * rr;
    };
    return hit(headY, HEAD_R) || hit(bodyY, BODY_R);
  }

  function updateHud(remaining) {
    const sec = Math.ceil(remaining / 1000);
    timeEl.textContent = `남은 시간 ${sec}초`;
    timeEl.classList.toggle('low', running && sec <= 10);
    scoreEl.textContent = `받은 눈송이 ${score}개`;
  }

  function spawn(now) {
    const m = FLAKE_R + 6;
    flakes.push({
      x: m + Math.random() * Math.max(1, W - m * 2),
      y: -FLAKE_R,
      rot: Math.random() * Math.PI,
      spin: (Math.random() - 0.5) * 1.6
    });
    lastSpawn = now;
  }

  // ---------------- 그리기 ----------------
  function drawSky() {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#1d2b4f');
    g.addColorStop(0.6, '#3b4f86');
    g.addColorStop(1, '#8f8fc4');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    for (const s of stars) {
      ctx.fillStyle = `rgba(255,255,255,${s.a})`;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fill();
    }

    // 달
    const mx = W - Math.min(110, W * 0.16), my = Math.min(130, H * 0.22);
    const glow = ctx.createRadialGradient(mx, my, 10, mx, my, 90);
    glow.addColorStop(0, 'rgba(255,240,200,0.35)');
    glow.addColorStop(1, 'rgba(255,240,200,0)');
    ctx.fillStyle = glow;
    ctx.beginPath(); ctx.arc(mx, my, 90, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fff4d6';
    ctx.beginPath(); ctx.arc(mx, my, 28, 0, Math.PI * 2); ctx.fill();

    // 먼 언덕
    ctx.fillStyle = '#6f78ad';
    ctx.beginPath();
    ctx.moveTo(0, H - GROUND_H - 30);
    ctx.quadraticCurveTo(W * 0.25, H - GROUND_H - 90, W * 0.5, H - GROUND_H - 35);
    ctx.quadraticCurveTo(W * 0.78, H - GROUND_H + 5, W, H - GROUND_H - 60);
    ctx.lineTo(W, H); ctx.lineTo(0, H);
    ctx.closePath(); ctx.fill();

    // 바닥 눈
    ctx.fillStyle = '#eef2ff';
    ctx.beginPath();
    ctx.moveTo(0, H - GROUND_H + 8);
    ctx.quadraticCurveTo(W / 2, H - GROUND_H - 14, W, H - GROUND_H + 8);
    ctx.lineTo(W, H); ctx.lineTo(0, H);
    ctx.closePath(); ctx.fill();
  }

  function drawSnowman() {
    const { bodyY, headY } = snowmanParts();
    const x = playerX;

    // 그림자
    ctx.fillStyle = 'rgba(60,70,130,0.18)';
    ctx.beginPath();
    ctx.ellipse(x, bodyY + BODY_R - 4, BODY_R * 0.95, 7, 0, 0, Math.PI * 2);
    ctx.fill();

    const ball = (cy, r) => {
      const g = ctx.createRadialGradient(x - r * 0.35, cy - r * 0.4, r * 0.2, x, cy, r);
      g.addColorStop(0, '#ffffff');
      g.addColorStop(1, '#dfe5f7');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(x, cy, r, 0, Math.PI * 2); ctx.fill();
    };
    ball(bodyY, BODY_R);
    ball(headY, HEAD_R);

    // 눈 (검은 점 두 개)
    ctx.fillStyle = '#1b2236';
    ctx.beginPath(); ctx.arc(x - 8, headY - 5, 3, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(x + 8, headY - 5, 3, 0, Math.PI * 2); ctx.fill();

    // 코 (주황색 당근, 움직이는 방향을 바라봄)
    const dir = keys.right && !keys.left ? 1 : keys.left && !keys.right ? -1 : 1;
    ctx.fillStyle = '#f39237';
    ctx.beginPath();
    ctx.moveTo(x, headY + 1);
    ctx.lineTo(x + dir * 18, headY + 4);
    ctx.lineTo(x, headY + 7);
    ctx.closePath(); ctx.fill();
  }

  function drawFlake(f) {
    ctx.save();
    ctx.translate(f.x, f.y);
    ctx.rotate(f.rot);
    ctx.strokeStyle = '#ffffff';
    ctx.lineCap = 'round';
    ctx.lineWidth = 2;
    ctx.shadowColor = 'rgba(200,220,255,0.9)';
    ctx.shadowBlur = 6;
    for (let i = 0; i < 6; i++) {
      ctx.rotate(Math.PI / 3);
      ctx.beginPath();
      ctx.moveTo(0, 0); ctx.lineTo(0, -FLAKE_R);
      ctx.moveTo(0, -FLAKE_R * 0.55); ctx.lineTo(-3.5, -FLAKE_R * 0.8);
      ctx.moveTo(0, -FLAKE_R * 0.55); ctx.lineTo(3.5, -FLAKE_R * 0.8);
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawPops(now) {
    ctx.font = '700 18px system-ui, sans-serif';
    ctx.textAlign = 'center';
    pops = pops.filter(p => now - p.t < 600);
    for (const p of pops) {
      const k = (now - p.t) / 600;
      ctx.fillStyle = `rgba(255,184,92,${1 - k})`;
      ctx.fillText('+1', p.x, p.y - k * 30);
    }
  }

  function draw(now = performance.now()) {
    drawSky();
    drawSnowman();
    flakes.forEach(drawFlake);
    drawPops(now);
  }

  // ---------------- 진행 ----------------
  function frame(now) {
    if (!running) return;
    const dt = Math.min((now - lastFrame) / 1000, 0.05);
    lastFrame = now;

    const remaining = Math.max(0, DURATION - (now - startTime));
    if (remaining <= 0) { finish(); return; }

    if (keys.left !== keys.right) {
      playerX += (keys.right ? 1 : -1) * PLAYER_SPEED * dt;
      clampPlayer();
    }

    if (now - lastSpawn >= SPAWN_INTERVAL) spawn(now);

    for (let i = flakes.length - 1; i >= 0; i--) {
      const f = flakes[i];
      f.y += SNOW_SPEED * dt;
      f.rot += f.spin * dt;
      if (caught(f)) {
        flakes.splice(i, 1);
        score += 1;
        pops.push({ x: f.x, y: f.y, t: now });
      } else if (f.y - FLAKE_R > H - GROUND_H + 4) {
        flakes.splice(i, 1);          // 바닥에 닿으면 그냥 사라짐 (점수 변화 없음)
      }
    }

    updateHud(remaining);
    draw(now);
    requestAnimationFrame(frame);
  }

  function finish() {
    running = false;
    keys.left = keys.right = false;
    flakes = [];
    pops = [];
    updateHud(0);
    draw();
    resultText.textContent = `끝! 받은 눈송이 ${score}개`;
    result.classList.add('show');
    restartBtn.focus();
  }

  function start() {
    score = 0;
    flakes = [];
    pops = [];
    keys.left = keys.right = false;
    playerX = W / 2;
    result.classList.remove('show');
    intro.classList.remove('show');
    restartBtn.blur();
    startBtn.blur();
    running = true;
    startTime = lastFrame = lastSpawn = performance.now();
    updateHud(DURATION);
    requestAnimationFrame(frame);
  }

  // ---------------- 입력 ----------------
  const isLeft = k => k === 'ArrowLeft' || k === 'Left';
  const isRight = k => k === 'ArrowRight' || k === 'Right';

  document.addEventListener('keydown', e => {
    if (!isLeft(e.key) && !isRight(e.key)) return;
    e.preventDefault();
    if (!running) return;               // 끝난 뒤에는 움직이지 않음
    if (isLeft(e.key)) keys.left = true;
    if (isRight(e.key)) keys.right = true;
  });
  document.addEventListener('keyup', e => {
    if (isLeft(e.key)) keys.left = false;
    if (isRight(e.key)) keys.right = false;
  });
  window.addEventListener('blur', () => { keys.left = keys.right = false; });
  window.addEventListener('resize', resize);
  restartBtn.addEventListener('click', start);
  startBtn.addEventListener('click', start);

  // 파일을 열면 바로 시작하지 않고 '시작' 버튼을 기다림
  resize();
  playerX = W / 2;
  updateHud(DURATION);
  draw();
  startBtn.focus();
})();
</script>
</body>
</html>
