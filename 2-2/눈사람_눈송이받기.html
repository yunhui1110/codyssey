<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>눈사람 눈송이 받기</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: #0f1b33;
    color: #ffffff;
    font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 12px;
  }
  #game {
    position: relative;
    width: min(480px, 100%, calc((100vh - 110px) * 0.75));
  }
  #hud {
    display: flex;
    justify-content: space-between;
    font-size: 20px;
    font-weight: bold;
    padding: 0 4px 8px;
    font-variant-numeric: tabular-nums;
  }
  #stage { position: relative; }
  canvas {
    display: block;
    width: 100%;
    height: auto;
    border-radius: 12px;
    background: linear-gradient(#1c3564, #4f7fc0);
  }
  #end {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    background: rgba(10, 20, 45, 0.78);
    border-radius: 12px;
    text-align: center;
  }
  #end[hidden] { display: none; }
  #end p { margin: 0; font-size: 28px; font-weight: bold; }
  #restart {
    font: inherit;
    font-size: 20px;
    font-weight: bold;
    padding: 12px 28px;
    border: 0;
    border-radius: 999px;
    background: #ffffff;
    color: #17305e;
    cursor: pointer;
  }
  #restart:hover { background: #dbe8ff; }
  #restart:focus-visible { outline: 3px solid #ffd166; outline-offset: 3px; }
  #help { margin: 0; font-size: 15px; color: #c5d4f2; }
</style>
</head>
<body>
  <div id="game">
    <div id="hud">
      <span id="time">남은 시간 45초</span>
      <span id="score">받은 눈송이 0개</span>
    </div>
    <div id="stage">
      <canvas id="canvas" width="480" height="640" aria-label="눈사람이 눈송이를 받는 게임 화면"></canvas>
      <div id="end" hidden>
        <p id="result">끝! 받은 눈송이 0개</p>
        <button id="restart" type="button">다시 하기</button>
      </div>
    </div>
  </div>
  <p id="help">키보드 ← → 키로 눈사람을 움직여 눈송이를 받으세요.</p>

<script>
(function () {
  // ----- 게임 설정 -----
  var GAME_SECONDS = 45;      // 한 판 시간(초)
  var SPAWN_INTERVAL = 1;     // 눈송이가 나오는 간격(초)
  var FLAKE_SPEED = 170;      // 눈송이가 떨어지는 속도(1초에 몇 칸)
  var SNOWMAN_SPEED = 330;    // 눈사람이 움직이는 속도(1초에 몇 칸)
  var FLAKE_R = 11;           // 눈송이 크기(반지름)

  var canvas = document.getElementById('canvas');
  var ctx = canvas.getContext('2d');
  var W = canvas.width;
  var H = canvas.height;
  var GROUND_Y = H - 40;      // 눈밭이 시작되는 높이

  var BODY_R = 34;            // 눈사람 몸통 반지름
  var HEAD_R = 22;            // 눈사람 머리 반지름
  var BODY_Y = GROUND_Y - BODY_R + 6;
  var HEAD_Y = BODY_Y - BODY_R - HEAD_R + 8;

  var timeEl = document.getElementById('time');
  var scoreEl = document.getElementById('score');
  var endEl = document.getElementById('end');
  var resultEl = document.getElementById('result');
  var restartBtn = document.getElementById('restart');

  var snowmanX, flakes, score, elapsed, spawnTimer, playing;
  var keys = { left: false, right: false };
  var lastTime = null;

  function startGame() {
    snowmanX = W / 2;
    flakes = [];
    score = 0;
    elapsed = 0;
    spawnTimer = SPAWN_INTERVAL;   // 시작하자마자 첫 눈송이가 나옵니다
    playing = true;
    keys.left = false;
    keys.right = false;
    lastTime = null;
    endEl.hidden = true;
    updateHud();
  }

  function endGame() {
    playing = false;
    flakes = [];
    elapsed = GAME_SECONDS;
    updateHud();
    resultEl.textContent = '끝! 받은 눈송이 ' + score + '개';
    endEl.hidden = false;
    restartBtn.focus();
  }

  function updateHud() {
    var left = Math.max(0, Math.ceil(GAME_SECONDS - elapsed));
    timeEl.textContent = '남은 시간 ' + left + '초';
    scoreEl.textContent = '받은 눈송이 ' + score + '개';
  }

  function touches(flake, cx, cy, r) {
    var dx = flake.x - cx;
    var dy = flake.y - cy;
    var d = r + FLAKE_R;
    return dx * dx + dy * dy <= d * d;
  }

  // 아주 짧은 시간(step초)만큼 게임을 한 걸음 진행합니다
  function step(dt) {
    elapsed += dt;
    if (elapsed >= GAME_SECONDS) {
      endGame();
      return;
    }

    if (keys.left && !keys.right) snowmanX -= SNOWMAN_SPEED * dt;
    if (keys.right && !keys.left) snowmanX += SNOWMAN_SPEED * dt;
    if (snowmanX < BODY_R) snowmanX = BODY_R;
    if (snowmanX > W - BODY_R) snowmanX = W - BODY_R;

    spawnTimer += dt;
    if (spawnTimer >= SPAWN_INTERVAL) {
      spawnTimer -= SPAWN_INTERVAL;
      flakes.push({
        x: FLAKE_R + Math.random() * (W - FLAKE_R * 2),
        y: -FLAKE_R
      });
    }

    for (var i = flakes.length - 1; i >= 0; i--) {
      var f = flakes[i];
      f.y += FLAKE_SPEED * dt;
      if (touches(f, snowmanX, HEAD_Y, HEAD_R) || touches(f, snowmanX, BODY_Y, BODY_R)) {
        flakes.splice(i, 1);     // 눈사람에 닿으면 사라지고 1개 늘어납니다
        score += 1;
      } else if (f.y >= GROUND_Y) {
        flakes.splice(i, 1);     // 바닥에 닿으면 그냥 사라집니다
      }
    }
  }

  function drawFlake(x, y) {
    ctx.save();
    ctx.translate(x, y);
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 2.5;
    ctx.lineCap = 'round';
    for (var i = 0; i < 3; i++) {
      ctx.rotate(Math.PI / 3);
      ctx.beginPath();
      ctx.moveTo(-FLAKE_R, 0);
      ctx.lineTo(FLAKE_R, 0);
      ctx.stroke();
    }
    ctx.restore();
  }

  function circle(x, y, r, color) {
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fillStyle = color;
    ctx.fill();
  }

  function drawSnowman(x) {
    // 몸통과 머리
    circle(x, BODY_Y, BODY_R, '#ffffff');
    circle(x, HEAD_Y, HEAD_R, '#ffffff');
    ctx.strokeStyle = '#b9c9e6';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(x, BODY_Y, BODY_R, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.arc(x, HEAD_Y, HEAD_R, 0, Math.PI * 2); ctx.stroke();
    // 눈
    circle(x - 8, HEAD_Y - 5, 3, '#1b1b1b');
    circle(x + 8, HEAD_Y - 5, 3, '#1b1b1b');
    // 주황색 코
    ctx.beginPath();
    ctx.moveTo(x, HEAD_Y - 1);
    ctx.lineTo(x + 15, HEAD_Y + 3);
    ctx.lineTo(x, HEAD_Y + 6);
    ctx.closePath();
    ctx.fillStyle = '#ff8c1a';
    ctx.fill();
    // 단추
    circle(x, BODY_Y - 12, 3, '#1b1b1b');
    circle(x, BODY_Y + 2, 3, '#1b1b1b');
    circle(x, BODY_Y + 16, 3, '#1b1b1b');
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    // 눈밭
    ctx.fillStyle = '#eef4ff';
    ctx.fillRect(0, GROUND_Y, W, H - GROUND_Y);
    for (var i = 0; i < flakes.length; i++) drawFlake(flakes[i].x, flakes[i].y);
    drawSnowman(snowmanX);
  }

  function frame(now) {
    if (playing) {
      if (lastTime === null) lastTime = now;
      var dt = (now - lastTime) / 1000;
      lastTime = now;
      // 화면이 잠깐 멈췄다 돌아와도 눈송이가 눈사람을 뚫고 지나가지 않도록 잘게 나눠 진행합니다
      while (dt > 0 && playing) {
        var s = Math.min(dt, 1 / 120);
        step(s);
        dt -= s;
      }
      if (playing) updateHud();
    }
    draw();
    requestAnimationFrame(frame);
  }

  window.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
      e.preventDefault();
      if (!playing) return;
      if (e.key === 'ArrowLeft') keys.left = true;
      else keys.right = true;
    }
  });

  window.addEventListener('keyup', function (e) {
    if (e.key === 'ArrowLeft') keys.left = false;
    if (e.key === 'ArrowRight') keys.right = false;
  });

  // 다른 창으로 넘어가면 누르고 있던 키를 뗀 것으로 봅니다
  window.addEventListener('blur', function () {
    keys.left = false;
    keys.right = false;
  });

  // 다른 탭에 가 있는 동안에는 게임 시간이 흐르지 않습니다
  document.addEventListener('visibilitychange', function () {
    lastTime = null;
  });

  restartBtn.addEventListener('click', startGame);

  startGame();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
